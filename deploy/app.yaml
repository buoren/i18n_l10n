# App Engine configuration (alternative to Cloud Run)
runtime: python311

# Environment variables
env_variables:
  PROJECT_ID: "i18n-l10n"
  DB_CONNECTION_NAME: "i18n-l10n:europe-north1:i18n-l10n-mysql"
  DB_NAME: "i18n_l10n_db"
  DB_USER: "appuser"

# Automatic scaling
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6

# Resources
resources:
  cpu: 1
  memory_gb: 1

# Health checks
readiness_check:
  path: "/"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
