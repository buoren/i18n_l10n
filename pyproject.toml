[tool.poetry]
name = "i18n-l10n"
version = "0.1.0"
description = "Hello World NiceGUI application for i18n/l10n testing"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "i18n_l10n"}]

[tool.poetry.dependencies]
python = "^3.8.1"
nicegui = "^1.4.0"
sqlalchemy = "^2.0.0"
pymysql = "^1.1.0"
cryptography = "^41.0.0"
google-cloud-translate = "^3.11.0"
google-auth = "^2.23.0"
google-auth-oauthlib = "^1.1.0"
google-auth-httplib2 = "^0.2.0"
PyJWT = "^2.8.0"
python-jose = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
i18n-app = "i18n_l10n.main:main"
